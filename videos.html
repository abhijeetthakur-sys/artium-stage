<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch · Artium unMute</title>
<meta name="description" content="Live performances from Artium unMute — Bangalore, Mumbai, Chennai and Hyderabad. All on camera.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Artium">
<meta property="og:title" content="Watch · Artium unMute">
<meta property="og:description" content="Live performances from Artium unMute. All on camera.">
<meta property="og:image" content="https://img.youtube.com/vi/U7FDQc14Vgw/hqdefault.jpg">
<meta property="og:url" content="https://artiumacademy.com/videos.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Watch · Artium unMute">
<meta name="twitter:description" content="Live performances from Artium unMute. All on camera.">
<meta name="twitter:image" content="https://img.youtube.com/vi/U7FDQc14Vgw/hqdefault.jpg">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231a1816'/><text x='16' y='25' font-family='Georgia%2Cserif' font-size='23' font-weight='900' fill='%23d63f96' text-anchor='middle'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Syne:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#1a1816;--bg2:#222018;--bg3:#2a2820;
  --ink:#f7f2ea;--ink2:#ddd5c8;--ink3:#b0a898;
  --pink:#d63f96;--pink2:#f072bc;
  --coral:#d95030;--coral2:#f08060;
  --card:#1e1c18;--border:rgba(255,255,255,.08);
  --black:#08070a;
}
html{scroll-behavior:smooth;}
body{font-family:'Newsreader',serif;font-size:15px;background:var(--bg);color:var(--ink);overflow-x:hidden;cursor:none;}

#dot{position:fixed;width:7px;height:7px;background:var(--pink);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .22s;}
#ring{position:fixed;width:28px;height:28px;border:1px solid rgba(214,63,150,.35);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .32s,height .32s,opacity .28s;}
.bc #dot{width:13px;height:13px;background:var(--pink2);}
.bc #ring{width:48px;height:48px;opacity:.1;}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.022'/%3E%3C/svg%3E");pointer-events:none;z-index:9990;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:18px 52px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(8,7,10,.82),transparent);transition:background .5s,padding .4s,box-shadow .4s;}
nav.stuck{background:rgba(16,14,12,.93);backdrop-filter:blur(22px);box-shadow:0 1px 0 rgba(255,255,255,.04);padding:12px 52px;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:none;}
.nav-brand img{height:44px;width:auto;transition:opacity .25s;}
.nav-brand img:hover{opacity:.8;}
.nav-tag{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--coral);opacity:.85;}

/* CAROUSEL */
.carousel-wrap{padding-top:88px;overflow:hidden;position:relative;}
.carousel-wrap::before{content:'';position:absolute;top:0;left:0;width:100px;height:100%;background:linear-gradient(to right,var(--bg),transparent);z-index:10;pointer-events:none;}
.carousel-wrap::after{content:'';position:absolute;top:0;right:0;width:100px;height:100%;background:linear-gradient(to left,var(--bg),transparent);z-index:10;pointer-events:none;}
.carousel-track{display:flex;gap:10px;width:max-content;animation:marquee 60s linear infinite;}
.carousel-track:hover{animation-play-state:paused;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.c-thumb{flex-shrink:0;width:240px;height:135px;border-radius:8px;overflow:hidden;cursor:none;position:relative;}
.c-thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.68) saturate(.7);transition:filter .25s;}
.c-thumb:hover img{filter:brightness(.86) saturate(.95);}
.c-thumb-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s;}
.c-thumb:hover .c-thumb-play{opacity:1;}
.c-play-icon{width:38px;height:38px;background:rgba(214,63,150,.88);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.c-play-icon svg{width:13px;height:13px;fill:white;margin-left:2px;}

/* PAGE INTRO */
.page-intro{padding:40px 52px 4px;}
.intro-eyebrow{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--coral);display:block;margin-bottom:14px;}
.intro-line{font-family:'Playfair Display',serif;font-size:clamp(26px,3.6vw,42px);font-weight:900;line-height:1.08;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em;}
.intro-cities{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);}

/* CITIES */
.cities{padding:20px 52px 80px;}
.city{border-top:1px solid rgba(255,255,255,.06);}
.city:last-child{border-bottom:1px solid rgba(255,255,255,.06);}
.city-header{display:flex;align-items:center;justify-content:space-between;padding:24px 0;cursor:none;user-select:none;}
.city-header:hover .city-name{color:var(--coral2);}
.city-name{font-family:'Playfair Display',serif;font-size:clamp(24px,3.2vw,36px);font-weight:700;color:var(--ink);transition:color .2s;letter-spacing:-.01em;}
.city-right{display:flex;align-items:center;gap:14px;}
.city-count{font-family:'Syne',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);}
.city-badge{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(217,80,48,.12);color:var(--coral2);border-radius:100px;padding:4px 10px;}
.city-chevron{width:16px;height:16px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;transition:transform .3s;}
.city.closed .city-chevron{transform:rotate(-90deg);}

.city-body{overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;}
.city.closed .city-body{max-height:0 !important;opacity:0;}

.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:32px;}

/* VIDEO CARDS */
.v-card{background:var(--card);border:1px solid rgba(255,255,255,.055);border-radius:10px;overflow:hidden;cursor:none;transition:transform .22s,border-color .22s,box-shadow .22s;}
.v-card:hover{transform:translateY(-3px);border-color:rgba(217,80,48,.22);box-shadow:0 12px 36px rgba(0,0,0,.38);}
.v-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#121110;}
.v-thumb img{width:100%;height:100%;object-fit:cover;filter:brightness(.9) saturate(.85);transition:filter .3s,transform .35s;}
.v-card:hover .v-thumb img{filter:brightness(1) saturate(1);transform:scale(1.04);}
.v-play-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.24);opacity:0;transition:opacity .22s;}
.v-card:hover .v-play-wrap{opacity:1;}
.v-play-btn{width:44px;height:44px;background:var(--pink);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.v-card:hover .v-play-btn{transform:scale(1.08);}
.v-play-btn svg{width:14px;height:14px;fill:white;margin-left:2px;}
.v-info{padding:12px 14px 15px;}
.v-artist{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.v-song{font-family:'Newsreader',serif;font-size:13px;font-style:italic;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:2000;background:rgba(8,7,10,.92);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal-inner{position:relative;width:min(920px,94vw);}
.modal-ratio{position:relative;width:100%;padding-bottom:56.25%;}
.modal-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:9px;}
.modal-close{position:absolute;top:-36px;right:0;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.38);cursor:none;background:none;border:none;padding:0;transition:color .18s;}
.modal-close:hover{color:var(--pink2);}

@media(max-width:700px){
  nav,nav.stuck{padding-left:22px;padding-right:22px;}
  .carousel-wrap::before,.carousel-wrap::after{width:40px;}
  .c-thumb{width:180px;height:101px;}
  .page-intro,.cities{padding-left:22px;padding-right:22px;}
  .video-grid{grid-template-columns:1fr 1fr;}
  .city-badge{display:none;}
}
@media(max-width:440px){.video-grid{grid-template-columns:1fr;}}
.city-empty{font-family:'Newsreader',serif;font-size:14px;color:var(--ink3);
  opacity:.7;margin:4px 0 8px;padding:14px 2px;}
</style>
</head>
<body>

<div id="dot"></div>
<div id="ring"></div>

<nav id="nav">
  <a class="nav-brand" href="index.html">
    <img src="https://res.cloudinary.com/dd7s6bb58/image/upload/v1786100899/ARTIUM_LOGOMARK_REVERSE-cropped_bdldum.svg" alt="Artium">
  </a>
  <span class="nav-tag">unMute Live</span>
</nav>

<!-- CAROUSEL -->
<div class="carousel-wrap">
  <div class="carousel-track" id="carousel-track"></div>
</div>

<!-- INTRO -->
<div class="page-intro">
  <span class="intro-eyebrow">Artium unMute · Watch</span>
  <p class="intro-line" id="intro-line">Live performances.<br>All on camera.</p>
  <span class="intro-cities" id="intro-cities">Bangalore &nbsp;·&nbsp; Mumbai &nbsp;·&nbsp; Chennai</span>
</div>

<!-- CITIES -->
<div class="cities">

  <div class="city" id="city-bangalore">
    <div class="city-header" onclick="toggleCity('city-bangalore')">
      <span class="city-name">Bangalore</span>
      <div class="city-right">
        <span class="city-count" data-suffix="performances">7 performances</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-bangalore">
      <div class="video-grid" id="grid-bangalore"></div>
    </div>
  </div>

  <div class="city" id="city-mumbai">
    <div class="city-header" onclick="toggleCity('city-mumbai')">
      <span class="city-name">Mumbai</span>
      <div class="city-right">
        <span class="city-count" data-suffix="performances">10 performances</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-mumbai">
      <div class="video-grid" id="grid-mumbai"></div>
    </div>
  </div>

  <div class="city" id="city-chennai">
    <div class="city-header" onclick="toggleCity('city-chennai')">
      <span class="city-name">Chennai</span>
      <div class="city-right">
        <span class="city-count" data-suffix="performances">7 performances</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-chennai">
      <div class="video-grid" id="grid-chennai"></div>
    </div>
  </div>

  <div class="city" id="city-hyderabad">
    <div class="city-header" onclick="toggleCity('city-hyderabad')">
      <span class="city-name">Hyderabad</span>
      <div class="city-right">
        <span class="city-count" data-suffix="so far">Starts 14 August</span>
        <span class="city-badge">New every Friday</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-hyderabad">
      <div class="video-grid" id="grid-hyderabad"></div>
      <p class="city-empty" id="empty-hyderabad">First episode drops Friday 14 August.</p>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal-inner">
    <button class="modal-close" id="modal-close">&#x2715; &nbsp;Close</button>
    <div class="modal-ratio">
      <iframe id="modal-iframe" src="" title="Artium unMute" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
const VIDEOS = {
  bangalore: [
    {id:'Gprj7NRsib0', artist:'Sparsh Singhal', song:'O Rangrez'},
    {id:'9xBfhGA2F2I', artist:'Ananya S G', song:'Gilehriyaan'},
    {id:'BrbQJYvKyhQ', artist:'Sparsh & Ananya', song:'Moh Moh Ke Dhaage × Agar Tum Saath Ho'},
    {id:'8YY47vMI1GQ', artist:'Rohit Sundar', song:'Bolna'},
    {id:'J4BMC6lsPdg', artist:'Aradhya Rao', song:'Kabhi Neem Neem'},
    {id:'ia_pp2HnSZU', artist:'Rohit & Aradhya', song:'Bahara × Khabar Nahi'},
    {id:'T6PudGH1yp4', artist:'Aradhya & Rohit', song:'Kehna Hi Kya × Pardesiya'},
  ],
  mumbai: [
    {id:'EUxpadZYVNI', artist:'Lekhashree Rajashekhar', song:'Skyfall'},
    {id:'0IJtc5Ji9iM', artist:'Prissha Cholera', song:'Jiya Re'},
    {id:'700HvOcGf-4', artist:'Abhijeet & Shrey', song:'Tum Ho × Khaabon Ke Parinday'},
    {id:'vcypATSglXY', artist:'Jaydeep & Abhishek', song:'Chappa Chappa'},
    {id:'S0VNwOoyYZ0', artist:'Abhishek Marotkar', song:'Khel Mandala'},
    {id:'Ut2d6kSqAFA', artist:'Hridaya & Prissha', song:'Badal Pe Paon Hai'},
    {id:'OgKnGj5L5Fo', artist:'Neev Kanani', song:'Mere Naam Tu'},
    {id:'981RlPuL39U', artist:'Sudhanshu Shome', song:'Zamaana Lage'},
    {id:'E469HHvNbeM', artist:'Shalini Bairagi', song:'Salona Sa Sajan'},
    {id:'U7FDQc14Vgw', artist:'Hridaya Dande', song:'Thode Badmash'},
  ],
  chennai: [
    {id:'T0EbAplp7ow', artist:'Prashanthine Saravanan', song:'E taavunaraa'},
    {id:'zfrRiUW48uY', artist:'Aairah Singh', song:'The Climb'},
    {id:'h0yPQL2i3NE', artist:'Ahana Balaji', song:'Snehidhane'},
    {id:'wZyXwiZFTxs', artist:'Ridhudev', song:'Kannukkulla'},
    {id:'-E7BeS3biTk', artist:'Vinisha Vinoth', song:'Yaarumilla'},
    {id:'qWxe53KyZzc', artist:'Swarthamika', song:'Malargal Kaetten'},
    {id:'YDMLSihoY3s', artist:'Emilin', song:'Ammadi Ammadi'},
  ],
  hyderabad: [
  ],
};

// Carousel
const allVideos = Object.values(VIDEOS).flat();

// Headline stats — derived, so they never drift as cities and videos are added
(function introStats(){
  const WORDS = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight'];
  const live = Object.keys(VIDEOS).filter(c => VIDEOS[c].length);
  const cap  = c => c.charAt(0).toUpperCase() + c.slice(1);
  const line = document.getElementById('intro-line');
  const cits = document.getElementById('intro-cities');
  if(line) line.innerHTML = allVideos.length + ' performances.<br>' +
    (WORDS[live.length] || live.length) + (live.length===1?' city':' cities') + '. All on camera.';
  if(cits) cits.innerHTML = live.map(cap).join(' &nbsp;·&nbsp; ');
})();
const track = document.getElementById('carousel-track');
[...allVideos, ...allVideos].forEach(v => {
  const el = document.createElement('div');
  el.className = 'c-thumb';
  el.innerHTML = `<img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.artist}" loading="lazy"><div class="c-thumb-play"><div class="c-play-icon"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>`;
  el.addEventListener('click', () => openVideo(v.id));
  el.addEventListener('mouseenter', () => document.body.classList.add('bc'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
  track.appendChild(el);
});

// Grids
function buildGrid(id, videos) {
  const grid = document.getElementById(id);
  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'v-card';
    card.innerHTML = `<div class="v-thumb"><img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.artist}" loading="lazy"><div class="v-play-wrap"><div class="v-play-btn"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div></div><div class="v-info"><p class="v-artist">${v.artist}</p><p class="v-song">${v.song}</p></div>`;
    card.addEventListener('click', () => openVideo(v.id));
    card.addEventListener('mouseenter', () => document.body.classList.add('bc'));
    card.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
    grid.appendChild(card);
  });
}
Object.keys(VIDEOS).forEach(city => {
  buildGrid('grid-' + city, VIDEOS[city]);
  // keep the header count in step with the data (was hardcoded and drifted)
  const n = VIDEOS[city].length;
  const el = document.querySelector('#city-' + city + ' .city-count');
  if(el && n > 0) el.textContent = n + ' ' + (el.dataset.suffix || 'performances');
  const empty = document.getElementById('empty-' + city);
  if(empty && n > 0) empty.remove();
});

// Accordion — set initial max-heights
document.querySelectorAll('.city-body').forEach(b => { b.style.maxHeight = b.scrollHeight + 'px'; });

function toggleCity(id) {
  const city = document.getElementById(id);
  const body = document.getElementById('body-' + id);
  const isOpen = !city.classList.contains('closed');
  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => { body.style.maxHeight = '0'; body.style.opacity = '0'; });
    city.classList.add('closed');
  } else {
    city.classList.remove('closed');
    body.style.maxHeight = body.scrollHeight + 'px';
    body.style.opacity = '1';
    body.addEventListener('transitionend', () => { if (!city.classList.contains('closed')) body.style.maxHeight = 'none'; }, {once:true});
  }
}

// Cursor
const dot = document.getElementById('dot'), ring = document.getElementById('ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
(function t(){rx+=(mx-rx)*.09;ry+=(my-ry)*.09;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(t);})();
document.querySelectorAll('a,button,.city-header').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('bc'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
});

// Nav
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('stuck', window.scrollY > 30), {passive:true});

// Modal
const modalBg = document.getElementById('modal-bg');
const modalIframe = document.getElementById('modal-iframe');
function openVideo(id) {
  modalIframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  modalBg.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVideo() {
  modalBg.classList.remove('open');
  modalIframe.src = '';
  document.body.style.overflow = '';
}
document.getElementById('modal-close').addEventListener('click', closeVideo);
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });

// Deep-link from Stage search: videos.html?v=YOUTUBE_ID
const vParam = new URLSearchParams(window.location.search).get('v');
if (vParam) openVideo(vParam);
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
