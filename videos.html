<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch · Artium unMute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#111010;
  --bg2:#191818;
  --ink:#f0ebe3;
  --ink2:#c8c0b4;
  --ink3:#7a7268;
  --coral:#d95030;
  --coral2:#f07050;
  --card:#1c1a1a;
  --border:rgba(255,255,255,.07);
  --black:#0a0909;
}
html{scroll-behavior:smooth;}
body{font-family:'Space Grotesk',sans-serif;font-size:15px;background:var(--bg);color:var(--ink);overflow-x:hidden;cursor:none;}

#dot{position:fixed;width:6px;height:6px;background:var(--coral);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s;}
#ring{position:fixed;width:26px;height:26px;border:1px solid rgba(217,80,48,.3);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .28s,height .28s,opacity .22s;}
.bc #dot{width:11px;height:11px;}
.bc #ring{width:44px;height:44px;opacity:.08;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:500;padding:18px 48px;display:flex;align-items:center;justify-content:space-between;}
nav.stuck{background:rgba(10,9,9,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05);}
.nav-back{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(240,235,227,.45);text-decoration:none;cursor:none;transition:color .2s;display:flex;align-items:center;gap:8px;}
.nav-back:hover{color:var(--ink);}
.nav-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.nav-tag{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);opacity:.8;}

/* CAROUSEL */
.carousel-section{padding-top:82px;overflow:hidden;position:relative;}
.carousel-section::before{content:'';position:absolute;top:0;left:0;width:120px;height:100%;background:linear-gradient(to right,var(--black),transparent);z-index:10;pointer-events:none;}
.carousel-section::after{content:'';position:absolute;top:0;right:0;width:120px;height:100%;background:linear-gradient(to left,var(--black),transparent);z-index:10;pointer-events:none;}
.carousel-track{display:flex;gap:10px;width:max-content;animation:marquee 60s linear infinite;}
.carousel-track:hover{animation-play-state:paused;}
@keyframes marquee{
  0%{transform:translateX(0);}
  100%{transform:translateX(-50%);}
}
.c-thumb{flex-shrink:0;width:240px;height:135px;border-radius:8px;overflow:hidden;cursor:none;position:relative;}
.c-thumb img{width:100%;height:100%;object-fit:cover;transition:opacity .22s;}
.c-thumb:hover img{opacity:.75;}
.c-thumb-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s;}
.c-thumb:hover .c-thumb-overlay{opacity:1;}
.c-play-icon{width:40px;height:40px;background:rgba(217,80,48,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.c-play-icon svg{width:14px;height:14px;fill:white;margin-left:2px;}

/* PAGE INTRO */
.page-intro{padding:36px 48px 20px;}
.intro-tag{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--coral);opacity:.75;display:block;margin-bottom:10px;}
.intro-line{font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-.02em;margin-bottom:8px;line-height:1.3;}
.intro-count{font-size:13px;font-weight:400;color:var(--ink3);}

/* CITY SECTIONS */
.cities{padding:0 48px 80px;}
.city{border-top:1px solid var(--border);padding:0;}
.city:last-child{border-bottom:1px solid var(--border);}

.city-header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;cursor:none;user-select:none;}
.city-header:hover .city-name{color:var(--coral2);}
.city-name{font-size:26px;font-weight:700;color:var(--ink);transition:color .2s;letter-spacing:-.01em;}
.city-meta{display:flex;align-items:center;gap:16px;}
.city-count{font-size:12px;font-weight:500;color:var(--ink3);}
.city-badge{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:rgba(217,80,48,.12);color:var(--coral2);border-radius:100px;padding:3px 10px;}
.city-chevron{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2;stroke-linecap:round;transition:transform .3s;}
.city.closed .city-chevron{transform:rotate(-90deg);}

.city-body{overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .3s;}
.city.closed .city-body{max-height:0 !important;opacity:0;}

.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:28px;}

/* VIDEO CARDS */
.v-card{background:var(--card);border:1px solid rgba(255,255,255,.05);border-radius:10px;overflow:hidden;cursor:none;transition:transform .2s,border-color .2s,box-shadow .2s;}
.v-card:hover{transform:translateY(-3px);border-color:rgba(217,80,48,.22);box-shadow:0 10px 32px rgba(0,0,0,.4);}
.v-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0d0c0c;}
.v-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
.v-card:hover .v-thumb img{transform:scale(1.04);}
.v-play-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);opacity:0;transition:opacity .2s;}
.v-card:hover .v-play-wrap{opacity:1;}
.v-play-btn{width:44px;height:44px;background:var(--coral);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.v-card:hover .v-play-btn{transform:scale(1.08);}
.v-play-btn svg{width:15px;height:15px;fill:white;margin-left:2px;}
.v-info{padding:12px 14px 14px;}
.v-artist{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.v-song{font-size:12px;font-weight:400;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:2000;background:rgba(10,9,9,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-bg.open{opacity:1;pointer-events:all;}
.modal-inner{position:relative;width:min(920px,94vw);}
.modal-ratio{position:relative;width:100%;padding-bottom:56.25%;}
.modal-ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:none;border-radius:8px;}
.modal-close{position:absolute;top:-36px;right:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);cursor:none;background:none;border:none;padding:0;transition:color .18s;}
.modal-close:hover{color:var(--coral2);}

@media(max-width:700px){
  nav,.page-intro,.cities{padding-left:20px;padding-right:20px;}
  nav.stuck{padding-left:20px;padding-right:20px;}
  .carousel-section::before,.carousel-section::after{width:40px;}
  .c-thumb{width:180px;height:101px;}
  .video-grid{grid-template-columns:1fr 1fr;}
  .city-name{font-size:21px;}
}
@media(max-width:440px){
  .video-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="dot"></div>
<div id="ring"></div>

<nav id="nav">
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    The Stage
  </a>
  <span class="nav-tag">unMute Live</span>
</nav>

<!-- CAROUSEL -->
<div class="carousel-section">
  <div class="carousel-track" id="carousel-track"></div>
</div>

<div class="page-intro">
  <span class="intro-tag">Artium unMute</span>
  <p class="intro-line">22 performances. Three cities. All on camera.</p>
  <span class="intro-count">Bangalore · Mumbai · Chennai</span>
</div>

<!-- CITIES -->
<div class="cities">

  <div class="city" id="city-bangalore">
    <div class="city-header" onclick="toggleCity('city-bangalore')">
      <span class="city-name">Bangalore</span>
      <div class="city-meta">
        <span class="city-count">7 performances</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-bangalore">
      <div class="video-grid" id="grid-bangalore"></div>
    </div>
  </div>

  <div class="city" id="city-mumbai">
    <div class="city-header" onclick="toggleCity('city-mumbai')">
      <span class="city-name">Mumbai</span>
      <div class="city-meta">
        <span class="city-count">10 performances</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-mumbai">
      <div class="video-grid" id="grid-mumbai"></div>
    </div>
  </div>

  <div class="city" id="city-chennai">
    <div class="city-header" onclick="toggleCity('city-chennai')">
      <span class="city-name">Chennai</span>
      <div class="city-meta">
        <span class="city-count">5 so far</span>
        <span class="city-badge">New every Saturday</span>
        <svg class="city-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="city-body" id="body-city-chennai">
      <div class="video-grid" id="grid-chennai"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal-inner">
    <button class="modal-close" id="modal-close">✕ &nbsp;Close</button>
    <div class="modal-ratio">
      <iframe id="modal-iframe" src="" title="Artium unMute" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
const VIDEOS = {
  bangalore: [
    {id:'Gprj7NRsib0', artist:'Sparsh Singhal', song:'O Rangrez'},
    {id:'9xBfhGA2F2I', artist:'Ananya S G', song:'Gilehriyaan'},
    {id:'BrbQJYvKyhQ', artist:'Sparsh & Ananya', song:'Moh Moh Ke Dhaage × Agar Tum Saath Ho'},
    {id:'8YY47vMI1GQ', artist:'Rohit Sundar', song:'Bolna'},
    {id:'J4BMC6lsPdg', artist:'Aradhya Rao', song:'Kabhi Neem Neem'},
    {id:'ia_pp2HnSZU', artist:'Rohit & Aradhya', song:'Bahara × Khabar Nahi'},
    {id:'T6PudGH1yp4', artist:'Aradhya & Rohit', song:'Kehna Hi Kya × Pardesiya'},
  ],
  mumbai: [
    {id:'EUxpadZYVNI', artist:'Lekhashree Rajashekhar', song:'Skyfall'},
    {id:'0IJtc5Ji9iM', artist:'Prissha Cholera', song:'Jiya Re'},
    {id:'700HvOcGf-4', artist:'Abhijeet & Shrey', song:'Tum Ho × Khaabon Ke Parinday'},
    {id:'vcypATSglXY', artist:'Jaydeep & Abhishek', song:'Chappa Chappa'},
    {id:'S0VNwOoyYZ0', artist:'Abhishek Marotkar', song:'Khel Mandala'},
    {id:'Ut2d6kSqAFA', artist:'Hridaya & Prissha', song:'Badal Pe Paon Hai'},
    {id:'OgKnGj5L5Fo', artist:'Neev Kanani', song:'Mere Naam Tu'},
    {id:'981RlPuL39U', artist:'Sudhanshu Shome', song:'Zamaana Lage'},
    {id:'E469HHvNbeM', artist:'Shalini Bairagi', song:'Salona Sa Sajan'},
    {id:'U7FDQc14Vgw', artist:'Hridaya Dande', song:'Thode Badmash'},
  ],
  chennai: [
    {id:'T0EbAplp7ow', artist:'Prashanthine Saravanan', song:'E taavunaraa'},
    {id:'zfrRiUW48uY', artist:'Aairah Singh', song:'The Climb'},
    {id:'h0yPQL2i3NE', artist:'Ahana Balaji', song:'Snehidhane'},
    {id:'wZyXwiZFTxs', artist:'Ridhudev', song:'Kannukkulla'},
    {id:'-E7BeS3biTk', artist:'Vinisha Vinoth', song:'Yaarumilla'},
  ],
};

// Build carousel (all videos × 2 for seamless loop)
const allVideos = [...VIDEOS.bangalore, ...VIDEOS.mumbai, ...VIDEOS.chennai];
const track = document.getElementById('carousel-track');
[...allVideos, ...allVideos].forEach(v => {
  const el = document.createElement('div');
  el.className = 'c-thumb';
  el.innerHTML = `
    <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.artist}" loading="lazy">
    <div class="c-thumb-overlay">
      <div class="c-play-icon"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
    </div>`;
  el.addEventListener('click', () => openVideo(v.id));
  el.addEventListener('mouseenter', () => document.body.classList.add('bc'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
  track.appendChild(el);
});

// Build video grids
function buildGrid(gridId, videos) {
  const grid = document.getElementById(gridId);
  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'v-card';
    card.innerHTML = `
      <div class="v-thumb">
        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.artist}" loading="lazy">
        <div class="v-play-wrap">
          <div class="v-play-btn"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
        </div>
      </div>
      <div class="v-info">
        <p class="v-artist">${v.artist}</p>
        <p class="v-song">${v.song}</p>
      </div>`;
    card.addEventListener('click', () => openVideo(v.id));
    card.addEventListener('mouseenter', () => document.body.classList.add('bc'));
    card.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
    grid.appendChild(card);
  });
}

buildGrid('grid-bangalore', VIDEOS.bangalore);
buildGrid('grid-mumbai', VIDEOS.mumbai);
buildGrid('grid-chennai', VIDEOS.chennai);

// Set initial max-heights for open cities
document.querySelectorAll('.city-body').forEach(body => {
  body.style.maxHeight = body.scrollHeight + 'px';
});

// Accordion
function toggleCity(id) {
  const city = document.getElementById(id);
  const body = document.getElementById('body-' + id);
  const isOpen = !city.classList.contains('closed');
  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => {
      body.style.maxHeight = '0';
      body.style.opacity = '0';
    });
    city.classList.add('closed');
  } else {
    city.classList.remove('closed');
    body.style.maxHeight = body.scrollHeight + 'px';
    body.style.opacity = '1';
    body.addEventListener('transitionend', () => {
      if (!city.classList.contains('closed')) body.style.maxHeight = 'none';
    }, {once: true});
  }
}

// Cursor
const dot = document.getElementById('dot');
const ring = document.getElementById('ring');
document.addEventListener('mousemove', e => {
  dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
  ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
});
document.querySelectorAll('a,button,.city-header').forEach(el => {
  el.addEventListener('mouseenter', () => document.body.classList.add('bc'));
  el.addEventListener('mouseleave', () => document.body.classList.remove('bc'));
});

// Nav
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('stuck', window.scrollY > 30), {passive:true});

// Modal
const modalBg = document.getElementById('modal-bg');
const modalIframe = document.getElementById('modal-iframe');

function openVideo(id) {
  modalIframe.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
  modalBg.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVideo() {
  modalBg.classList.remove('open');
  modalIframe.src = '';
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeVideo);
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeVideo(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideo(); });
</script>
</body>
</html>
